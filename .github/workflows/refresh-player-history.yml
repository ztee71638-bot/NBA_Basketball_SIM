name: Refresh NBA player history

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    branches: [foundation/nba-simulator-mvp]
    paths:
      - "scripts/refresh_player_history.py"
      - "tests/test_player_history.py"
      - ".github/workflows/refresh-player-history.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nba-player-history-refresh
  cancel-in-progress: false

jobs:
  refresh-player-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Refresh player history
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_player_history.py
      - name: Commit player database
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/players.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/players.json
            git commit -m "chore: refresh NBA player history"
            git push
          else
            echo "No player data changes."
          fi
