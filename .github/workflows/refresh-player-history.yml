name: Refresh NBA player history

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    branches: [main, foundation/nba-simulator-mvp]
    paths:
      - "scripts/refresh_player_history.py"
      - ".github/workflows/refresh-player-history.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nba-player-history-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-player-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main before refresh
        if: github.event_name != 'pull_request'
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Refresh player history
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_player_history.py
      - name: Commit player database
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/players.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/players.json
            git commit -m "chore: refresh NBA player history"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            echo "Unable to push refreshed data after 5 attempts."
            exit 1
          else
            echo "No player data changes."
          fi
