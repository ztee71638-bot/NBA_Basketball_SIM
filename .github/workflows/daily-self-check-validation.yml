name: Daily self-check validation

on:
  pull_request:
    paths:
      - "scripts/daily_self_check.py"
      - "tests/test_daily_self_check.py"
      - ".github/workflows/daily-self-check.yml"
      - ".github/workflows/daily-self-check-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/daily_self_check.py"
      - "tests/test_daily_self_check.py"
      - ".github/workflows/daily-self-check.yml"
      - ".github/workflows/daily-self-check-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete test suite
        run: pytest -q
