name: Deploy NBA simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh NBA team history
      - Refresh NBA player history
      - Refresh NBA data
      - Refresh NBA player impact ratings
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep pull-request validation isolated from production deployments.
  # A PR build must never cancel a deployment triggered by refreshed main data.
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          python -m json.tool data/games.json >/dev/null
          python -m json.tool data/polymarket.json >/dev/null
          python -m json.tool data/players.json >/dev/null
          if [ -f data/player_roster.json ]; then
            python -m json.tool data/player_roster.json >/dev/null
          else
            echo "Player roster index will be generated by the player-history refresh after merge."
          fi
          python -m json.tool data/player_impact.json >/dev/null
          python -m json.tool data/teams.json >/dev/null
          python -m json.tool data/injuries.json >/dev/null
          python -m json.tool data/model_metrics.json >/dev/null
          if [ -f data/backtest_predictions.json ]; then python -m json.tool data/backtest_predictions.json >/dev/null; fi
          python -m json.tool data/arenas.json >/dev/null
          if [ -f data/data_quality.json ]; then python -m json.tool data/data_quality.json >/dev/null; fi
          if [ -f data/lineups.json ]; then python -m json.tool data/lineups.json >/dev/null; fi
          node --check app.js
      - name: Stage only production assets and app data
        run: |
          mkdir -p site/data
          cp index.html app.js styles.css site/
          for file in arenas.json games.json injuries.json lineups.json polymarket.json player_roster.json player_impact.json teams.json model_metrics.json data_quality.json players.json; do
            if [ -f "data/$file" ]; then
              cp "data/$file" site/data/
            fi
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
