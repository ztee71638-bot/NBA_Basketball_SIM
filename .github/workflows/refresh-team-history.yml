name: Refresh NBA team history

on:
  schedule:
    - cron: "45 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_team_history.py"
      - "scripts/import_supplemental_nba_stats.py"
      - "scripts/reconcile_supplemental_nba_stats.py"
      - "tests/test_supplemental_reconcile.py"
      - "tests/test_supplemental_import.py"
      - "tests/test_team_history.py"
      - "scripts/backtest_model.py"
      - "tests/test_backtest_model.py"
      - "tests/test_frontend_opponent_model.py"
      - "scripts/audit_data_quality.py"
      - "tests/test_data_quality.py"
      - ".github/workflows/refresh-team-history.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow || 'nba-shared-data-refresh' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-team-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide which data refreshes are required
        id: history-refresh
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Use the actual pushed commit range. This is reliable for merge commits,
          # where webhook commit file lists may be incomplete.
          CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          echo "$CHANGED_FILES"
          if grep -Eq '^(scripts/refresh_team_history.py|tests/test_team_history.py)$' <<< "$CHANGED_FILES"; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(scripts/refresh_team_history.py|scripts/import_supplemental_nba_stats.py|scripts/reconcile_supplemental_nba_stats.py|tests/test_team_history.py|tests/test_supplemental_import.py|tests/test_supplemental_reconcile.py|.github/workflows/refresh-team-history.yml)$' <<< "$CHANGED_FILES"; then
            echo "supplemental=true" >> "$GITHUB_OUTPUT"
          else
            echo "supplemental=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync latest main before refresh
        if: github.event_name != 'pull_request'
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Validate simulator JavaScript syntax
        run: node --check app.js
      - name: Refresh team history
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.history-refresh.outputs.refresh == 'true')
        run: python scripts/refresh_team_history.py
      - name: Import supplemental NBA Stats datasets
        if: github.event_name != 'push' || steps.history-refresh.outputs.supplemental == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/import_supplemental_nba_stats.py --output-dir "$RUNNER_TEMP/boxscorelab"
          else
            python scripts/import_supplemental_nba_stats.py
          fi
      - name: Reconcile supplemental NBA Stats records
        if: github.event_name != 'push' || steps.history-refresh.outputs.supplemental == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/reconcile_supplemental_nba_stats.py --supplemental-dir "$RUNNER_TEMP/boxscorelab"
          else
            python scripts/reconcile_supplemental_nba_stats.py
          fi
      - name: Validate reconciled data with chronological backtest
        if: github.event_name == 'pull_request'
        run: python scripts/backtest_model.py --output "$RUNNER_TEMP/model_metrics.json" --predictions-output "$RUNNER_TEMP/backtest_predictions.json"
      - name: Validate reconciled data quality
        if: github.event_name == 'pull_request'
        run: python scripts/audit_data_quality.py --teams data/teams.json --players data/players.json --output "$RUNNER_TEMP/data_quality.json"
      - name: Run chronological model backtest
        if: github.event_name != 'pull_request'
        run: python scripts/backtest_model.py --output data/model_metrics.json --predictions-output data/backtest_predictions.json
      - name: Audit archive coverage and integrity
        if: github.event_name != 'pull_request'
        run: python scripts/audit_data_quality.py --output data/data_quality.json
      - name: Commit team database
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/teams.json data/model_metrics.json data/data_quality.json data/backtest_predictions.json data/players.json data/snapshots/ data/supplemental/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/teams.json data/players.json data/model_metrics.json data/data_quality.json data/backtest_predictions.json data/snapshots/ data/supplemental/
            git commit -m "chore: refresh NBA team history"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            echo "Unable to push refreshed data after 5 attempts."
            exit 1
          else
            echo "No team data changes."
          fi
